name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, without the v prefix (for example, 0.1.0)
        required: true
        type: string
      next_development_version:
        description: Next development version (for example, 0.2.0-SNAPSHOT)
        required: true
        type: string
      maven_extension_version:
        description: Published quill-maven-extension version to embed (for example, 0.1.0)
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_development_version }}
          EXTENSION_VERSION: ${{ inputs.maven_extension_version }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Run Prepare Release from the default branch (${DEFAULT_BRANCH})" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if [[ ! "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?-SNAPSHOT$ ]]; then
            echo "Next development version must end with -SNAPSHOT: ${NEXT_VERSION}" >&2
            exit 1
          fi
          if [[ ! "${EXTENSION_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ || "${EXTENSION_VERSION}" == *-SNAPSHOT ]]; then
            echo "Maven extension version must be a release version: ${EXTENSION_VERSION}" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "Tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release commit and tag
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_development_version }}
          EXTENSION_VERSION: ${{ inputs.maven_extension_version }}
        run: |
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set-property \
            -Dproperty=quill.maven.extension.version \
            -DnewVersion="${EXTENSION_VERSION}" -DgenerateBackupPoms=false
          if ! git diff --quiet -- pom.xml; then
            git add pom.xml
            git commit -m "Use Maven extension ${EXTENSION_VERSION}"
          fi
          ./mvnw -B release:clean release:prepare \
            -DreleaseVersion="${RELEASE_VERSION}" \
            -DdevelopmentVersion="${NEXT_VERSION}" \
            -Dtag="v${RELEASE_VERSION}" \
            -DpushChanges=true \
            -Darguments="-DskipITs=false"

      - name: Start release workflow for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: gh workflow run release.yml --ref "v${RELEASE_VERSION}"

      - name: Summarize release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_development_version }}
          EXTENSION_VERSION: ${{ inputs.maven_extension_version }}
        run: |
          {
            echo "## Release prepared"
            echo
            echo "- Tag: \`v${RELEASE_VERSION}\`"
            echo "- Next development version: \`${NEXT_VERSION}\`"
            echo "- Maven extension: \`org.treblereel.mcp:quill-maven-extension:${EXTENSION_VERSION}\`"
            echo "- The dispatched Release workflow will verify the extension in Maven Central and publish the native archives."
          } >> "${GITHUB_STEP_SUMMARY}"
