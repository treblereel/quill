name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub's dependency review API is unavailable for private repositories
    # unless GitHub Advanced Security is enabled.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # tornado 6.5.10 in benchmarks/harness/cryostat-paired/template/data/capture-requirements.txt:
          # mitmproxy 12.3.1, the latest release, requires tornado<=6.5.10, and the fix is in 6.6.
          # The capture proxy runs only locally with a 127.0.0.1 upstream. Remove both once
          # mitmproxy accepts tornado 6.6.
          allow-ghsas: GHSA-pcg2-g6cj-q92c, GHSA-r4j5-9xpp-3985
