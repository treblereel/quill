name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Release must run against a v-prefixed tag, got ${GITHUB_REF}" >&2
            exit 1
          fi

  maven-extension:
    needs: validate-ref
    name: Verify Maven extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve published extension from Maven Central
        run: |
          extension_version="$(./mvnw -q help:evaluate \
            -Dexpression=quill.maven.extension.version -DforceStdout)"
          ./mvnw -B org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get \
            -Dartifact="org.treblereel.mcp:quill-maven-extension:${extension_version}" \
            -Dtransitive=false

  jvm:
    needs: maven-extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Set release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="${release_version}" -DprocessAllModules=true -DgenerateBackupPoms=false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify standalone Maven extension before integration tests
        run: ./mvnw -B -f quill-maven-extension/pom.xml verify
      - run: ./mvnw -B clean verify -DskipITs=false
      - name: Prepare release SBOM input
        run: |
          mkdir -p dist
          cp quill-app/target/quill-app-*-all.jar dist/quill-release.jar
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: dist/quill-release.jar
          format: spdx-json
          output-file: dist/quill.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: quill-sbom
          path: dist/quill.spdx.json
          if-no-files-found: error

  native:
    needs: maven-extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
          - os: macos-14
            artifact: macos-aarch64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Set release version
        if: runner.os != 'Windows'
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="${release_version}" -DprocessAllModules=true -DgenerateBackupPoms=false
      - name: Set release version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          .\mvnw.cmd -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set "-DnewVersion=$releaseVersion" -DprocessAllModules=true -DgenerateBackupPoms=false
      - if: runner.os != 'Windows'
        run: ./mvnw -B clean package -Pnative -DskipTests -DskipITs=true
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean package -Pnative -DskipTests -DskipITs=true
      - if: runner.os != 'Windows'
        run: ./quill-app/target/quill --version
      - if: runner.os == 'Windows'
        run: .\quill-app\target\quill.exe --version
      - name: Compile native Kotlin test fixture
        if: runner.os != 'Windows'
        run: ./mvnw -q -f tests/kotlin-maven/pom.xml compile
      - name: Compile native Kotlin test fixture on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -q -f tests/kotlin-maven/pom.xml compile
      - name: Verify native Kotlin runtime preparation and analysis
        run: python scripts/quill_kotlin_native_e2e.py --fixture tests/kotlin-maven
      - name: Sign and notarize macOS executable
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          REQUIRE_PLATFORM_SIGNING: ${{ vars.REQUIRE_PLATFORM_SIGNING }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_SIGNING_IDENTITY}" ]]; then
            if [[ "${REQUIRE_PLATFORM_SIGNING}" == "true" ]]; then
              echo "macOS signing is required, but the Apple signing secrets are incomplete" >&2
              exit 1
            fi
            echo "Apple signing secrets are absent; publishing an unsigned macOS executable"
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/quill-signing.p12"
          keychain_path="${RUNNER_TEMP}/quill-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" quill-app/target/quill
          codesign --verify --strict --verbose=2 quill-app/target/quill

          if [[ -n "${APPLE_ID}" && -n "${APPLE_TEAM_ID}" && -n "${APPLE_APP_PASSWORD}" ]]; then
            ditto -c -k --keepParent quill-app/target/quill "${RUNNER_TEMP}/quill-notarization.zip"
            xcrun notarytool submit "${RUNNER_TEMP}/quill-notarization.zip" \
              --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_APP_PASSWORD}" --wait
          elif [[ "${REQUIRE_PLATFORM_SIGNING}" == "true" ]]; then
            echo "macOS notarization is required, but notarization secrets are incomplete" >&2
            exit 1
          else
            echo "Apple notarization secrets are absent; the executable is signed but not notarized"
          fi
      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_PLATFORM_SIGNING: ${{ vars.REQUIRE_PLATFORM_SIGNING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            if ($env:REQUIRE_PLATFORM_SIGNING -eq "true") {
              throw "Windows signing is required, but the Authenticode secrets are incomplete"
            }
            Write-Host "Authenticode secrets are absent; publishing an unsigned Windows executable"
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "quill-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor
                   [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath, $env:WINDOWS_CERTIFICATE_PASSWORD, $flags)
          $store = [Security.Cryptography.X509Certificates.X509Store]::new("My", "CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($certificate)
          $store.Close()
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the runner" }
          & $signtool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 .\quill-app\target\quill.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          & $signtool.FullName verify /pa /v .\quill-app\target\quill.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }
      - name: Prepare native archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          stage="${RUNNER_TEMP}/quill-release"
          mkdir -p "${stage}"
          cp quill-app/target/quill "${stage}/quill"
          cp LICENSE README.md "${stage}/"
          tar -czf "dist/quill-${{ matrix.artifact }}.tar.gz" -C "${stage}" .
          shasum -a 256 "dist/quill-${{ matrix.artifact }}.tar.gz" > "dist/quill-${{ matrix.artifact }}.tar.gz.sha256"
      - name: Prepare Windows native archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "quill-release"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item .\quill-app\target\quill.exe (Join-Path $stage "quill.exe")
          Copy-Item .\LICENSE, .\README.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\quill-${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "dist\quill-${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  quill-${{ matrix.artifact }}.zip" | Set-Content -Encoding ascii "dist\quill-${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: quill-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  homebrew-test:
    name: Homebrew installation (${{ matrix.os }})
    needs: [jvm, native]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: quill-*
          path: dist
          merge-multiple: true
      - name: Prepare temporary tap from verified native archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/quill_homebrew.py --version "${RELEASE_TAG#v}" \
            --repository "${GITHUB_REPOSITORY}" --archives dist --output test-tap/Formula/quill.rb
          python3 - <<'PY'
          import os
          from pathlib import Path
          formula = Path('test-tap/Formula/quill.rb')
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"
          formula.write_text(formula.read_text().replace(base, Path('dist').resolve().as_uri()))
          PY
          git init test-tap
          git -C test-tap config user.name 'Quill Homebrew Test'
          git -C test-tap config user.email 'quill@example.invalid'
          git -C test-tap config commit.gpgsign false
          git -C test-tap add Formula/quill.rb
          git -C test-tap commit -m 'Validate release formula'
      - name: Install and test packaged Quill through Homebrew
        run: |
          brew tap quill-ci/native-test "file://${GITHUB_WORKSPACE}/test-tap"
          brew install quill-ci/native-test/quill
          brew test quill-ci/native-test/quill
      - name: Remove temporary Homebrew installation
        if: always()
        run: |
          if brew list --formula quill >/dev/null 2>&1; then
            brew uninstall quill-ci/native-test/quill
          fi
          brew untap quill-ci/native-test || true

  publish:
    needs: [jvm, native, homebrew-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/quill-*.tar.gz
            dist/quill-*.zip
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/quill-*.tar.gz
            dist/quill-*.zip
          sbom-path: dist/quill.spdx.json
      - name: Generate verified Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/quill_homebrew.py --version "${RELEASE_TAG#v}" \
            --repository "${GITHUB_REPOSITORY}" --archives dist --output dist/quill.rb
          ruby -c dist/quill.rb
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag

  homebrew-tap:
    needs: publish
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
