name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Set release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="${release_version}" -DprocessAllModules=true -DgenerateBackupPoms=false
      - run: ./mvnw -B clean verify -DskipITs=false

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-14
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Set release version
        if: runner.os != 'Windows'
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="${release_version}" -DprocessAllModules=true -DgenerateBackupPoms=false
      - name: Set release version on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          .\mvnw.cmd -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set "-DnewVersion=$releaseVersion" -DprocessAllModules=true -DgenerateBackupPoms=false
      - if: runner.os != 'Windows'
        run: ./mvnw -B clean verify -Pnative -DskipITs=false
      - if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify -Pnative -DskipITs=false
      - if: runner.os != 'Windows'
        run: ./quill-app/target/quill --version
      - if: runner.os == 'Windows'
        run: .\quill-app\target\quill.exe --version
      - name: Prepare native archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/quill-${{ matrix.artifact }}.tar.gz" -C quill-app/target quill
          shasum -a 256 "dist/quill-${{ matrix.artifact }}.tar.gz" > "dist/quill-${{ matrix.artifact }}.tar.gz.sha256"
      - name: Prepare Windows native archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path .\quill-app\target\quill.exe -DestinationPath "dist\quill-${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "dist\quill-${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  quill-${{ matrix.artifact }}.zip" | Set-Content -Encoding ascii "dist\quill-${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: quill-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [jvm, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
